<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>SW Tool</title>
  <link rel="stylesheet" href="../css/popup.css">
</head>
<body class="booting">
  <div class="popup">
    <div id="mainView" class="view">
      <div id="accountQuickSwitch" class="account-quick-switch" aria-label="Szybkie przełączanie kont"></div>

      <h2>SW TOOL</h2>

      <section class="quick-actions">
        <button id="accTutsBtn" class="btn btn-wide">Zapisz tuty</button>
        <div id="mainStatus" class="status" aria-live="polite"></div>
      </section>

      <button id="settingsBtn" class="settings-btn" type="button" title="Ustawienia" aria-label="Ustawienia">
        ⚙
      </button>
    </div>

    <div id="settingsView" class="view hidden">
      <div class="settings-header">
        <button id="backBtn" class="icon-btn" type="button" title="Wróć" aria-label="Wróć">←</button>
        <h2>USTAWIENIA</h2>
        <span class="header-spacer"></span>
      </div>

      <div class="tabs">
        <button class="tab-btn active" type="button" data-tab="general">Ogólne</button>
        <button class="tab-btn" type="button" data-tab="accounts">Konta</button>
      </div>

      <section id="tab-general" class="tab-panel">
        <div class="switch-group">
          <label for="dailyRewards">Dzienne nagrody</label>
          <label class="switch">
            <input type="checkbox" id="dailyRewards">
            <span class="slider"></span>
          </label>
        </div>

        <div class="switch-group">
          <label for="saveTuts">Zapis na turnieje</label>
          <label class="switch">
            <input type="checkbox" id="saveTuts">
            <span class="slider"></span>
          </label>
        </div>

        <div class="switch-group">
          <label for="hideReports">Ukrywanie raportów</label>
          <label class="switch">
            <input type="checkbox" id="hideReports">
            <span class="slider"></span>
          </label>
        </div>

        <div class="button-row">
          <button id="resetBtn" class="btn" type="button">Resetuj ustawienia</button>
        </div>
      </section>

      <section id="tab-accounts" class="tab-panel hidden">
        <p class="hint">
          Zapisz maksymalnie 5 kont. Przyciski na górze głównego widoku
          pozwalają później przełączyć konto jednym kliknięciem.
        </p>

        <div id="accountsList"></div>

        <div class="button-row">
          <button id="saveAccountsBtn" class="btn btn-wide" type="button">Zapisz konta</button>
        </div>

        <div id="accountStatus" class="status" aria-live="polite"></div>
      </section>
    </div>
  </div>

  <script src="../js/popup.js"></script>
</body>
</html>
